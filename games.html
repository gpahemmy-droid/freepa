  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1d1842 0%, #0d1329 55%, #090c18 100%);
      color: #eef2ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #c084fc, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #a5b4fc;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 740px;
    }
    .card {
      background: rgba(24, 29, 62, 0.85);
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:hover {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.32), rgba(59, 130, 246, 0.32));
      border-color: #818cf8;
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(59, 130, 246, 0.22);
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }
    .card span {
      padding: 12px;
    }
  </style>
</head>
