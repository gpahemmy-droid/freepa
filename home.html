<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>freepa — Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1d1842 0%, #0d1329 55%, #090c18 100%);
      color: #eef2ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #c084fc, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #a5b4fc;
      margin-bottom: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 660px;
    }
    .card {
      background: rgba(24, 29, 62, 0.85);
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
    }
    .card:hover {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.32), rgba(59, 130, 246, 0.32));
      border-color: #818cf8;
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(59, 130, 246, 0.22);
    }
  </style>
</head>
<body>
  <h1>freepa</h1>
  <p>Pick a spot below or enter a URL in the bar above.</p>

  <div class="grid">
    <button class="card" onclick="window.location.href='games.html'">🎮 Games</button>
    <button class="card" onclick="openSite('https://aether.ist/')">🎬 Movies</button>
    <button class="card" onclick="openSite('https://example.com')">🌐 Example Site</button>
    <button class="card" onclick="openSite('https://duckduckgo.com')">🦆 DuckDuckGo</button>
  </div>

  <script>
    function openSite(url) {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "navigate", url }, "*");
      } else {
        window.location.href = url;
      }
    }
  </script>
</body>
</html>
